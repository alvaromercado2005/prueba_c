<style>
  :root{ --bg-color:#0a0812; --texto-claro:#ffffff; box-sizing:border-box; }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; width:100%; min-height:100%;
    background:radial-gradient(circle at 50% 25%, #1a1526 0%, var(--bg-color) 70%);
    overflow-x:hidden; font-family:'Montserrat',sans-serif; color:var(--texto-claro);
    display:flex; flex-direction:column; align-items:center;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .section-inicio{ position:relative; width:100%; height:100vh; display:flex; justify-content:center; align-items:center; overflow:hidden; }
  .contenedor-lirio{ position:relative; width:92%; max-width:540px; height:88vh; max-height:760px; }
  svg{ width:100%; height:100%; filter:drop-shadow(0 0 25px rgba(244,166,198,0.3)); }

  .tallo{ stroke-dasharray:400; stroke-dashoffset:400; animation:dibujarTallo 4s cubic-bezier(.45,0,.15,1) forwards; }
  .hoja{ opacity:0; animation:aparecerFlor 2.2s ease 2.6s forwards; }
  .petalo{ transform-box:fill-box; transform-origin:50% 100%; opacity:0; animation:aparecerFlor 2.6s ease forwards, respirar 8s ease-in-out infinite; }
  .peca{ opacity:0; animation:aparecerFlor 1.8s ease forwards; }
  .estambre{ opacity:0; animation:aparecerFlor 1.8s ease forwards; }
  .papel{ opacity:0; animation:aparecerFlor 2s ease 4.6s forwards; }
  .flor-extra{ transform-box:fill-box; transform-origin:50% 100%; opacity:0; animation:aparecerFlor 2.6s ease forwards, respirar 8.5s ease-in-out infinite; animation-delay:3.2s,6s; }

  .petalo-trasero{ animation-delay:2.4s, 5s; }
  .petalo-delantero{ animation-delay:2.8s, 5.4s; }
  .petalo-centro{ animation-delay:3.2s, 5.8s; }
  .peca{ animation-delay:3.8s; }
  .estambre{ animation-delay:3.5s; }

  @keyframes dibujarTallo{ to{ stroke-dashoffset:0; } }
  @keyframes aparecerFlor{ to{ opacity:1; } }
  @keyframes respirar{ 0%,100%{ transform:scale(1) rotate(0deg); } 50%{ transform:scale(1.012) rotate(.3deg); } }

  .titulo-principal{
    position:absolute; bottom:5%; width:100%; text-align:center;
    font-family:'Playfair Display',serif; font-style:italic; font-size:2rem; letter-spacing:.5px;
    text-shadow:0 0 18px rgba(244,166,198,.6); opacity:0;
    animation:aparecerFlor 3s ease 7s forwards; pointer-events:none;
  }
  .petalo-caida{ position:absolute; width:14px; height:22px; border-radius:15px 0 15px 15px; top:-30px; z-index:0; opacity:.55; filter:blur(.5px); pointer-events:none; }
  .section-hidden{ display:none; }
</style>

  <script>
    function crearPetalo(){
      const p=document.createElement('div');
      p.classList.add('petalo-caida');
      p.style.left=Math.random()*window.innerWidth+'px';
      p.style.animationDuration=(Math.random()*6+9)+'s';
      p.style.animationName='caer';
      p.style.animationTimingFunction='linear';
      p.style.animationFillMode='forwards';
      const size=Math.random()*8+10;
      p.style.width=size+'px';
      p.style.height=(size*1.6)+'px';
      const hue=330+Math.random()*20;
      p.style.backgroundColor=`hsl(${hue},70%,88%)`;
      document.body.appendChild(p);
      setTimeout(()=>p.remove(),16000);
    }
    const styleSheet=document.createElement('style');
    styleSheet.textContent=`@keyframes caer{ to{ transform:translateY(110vh) rotate(300deg); opacity:0; } }`;
    document.head.appendChild(styleSheet);

    let intervaloPetalos;
    const observer=new IntersectionObserver((entries)=>{
      if(entries[0].isIntersecting){ intervaloPetalos=setInterval(crearPetalo,900); }
      else{ clearInterval(intervaloPetalos); }
    });
    observer.observe(document.querySelector('.section-inicio'));
  </script>
</body>
</html>
