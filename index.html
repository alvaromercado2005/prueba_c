<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi novia 💖</title>
    <!-- Enlace a tus futuros estilos CSS -->
    <link rel="stylesheet" href="css/estilos.css">   
     <!-- Fuente tipo dibujo/boceto -->
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container" id="mainCard">
        <!-- Título principal -->
        <h1 id="tituloPrincipal">Cuenta atrás</h1>
        
        <!-- Mensaje dinámico que cambia según los días restantes -->
        <p class="subtitulo" id="mensajeDinamico">Cargando sorpresa...</p>

        <!-- Barra de carga -->
        <div class="barra-contenedor" id="barraContenedor">
            <div class="barra-progreso" id="barraProgreso"></div>
        </div>
        <div class="porcentaje-texto" id="porcentajeTexto">loading 0%</div>

        <!-- Reloj de cuenta atrás -->
        <div class="contador-grid">
            <div class="caja-tiempo">
                <span id="dias">00</span>
                <label>Días</label>
            </div>
            <div class="caja-tiempo">
                <span id="horas">00</span>
                <label>Horas</label>
            </div>
            <div class="caja-tiempo">
                <span id="minutos">00</span>
                <label>Minutos</label>
            </div>
            <div class="caja-tiempo">
                <span id="segundos">00</span>
                <label>Segundos</label>
            </div>
        </div>

        <!-- Botón para ir al menú de los 6 regalos -->
        <a href="menu.html" class="btn-entrar" id="btnEntrar">Abrir sorpresas 💖</a>
    </div>

    <!-- Enlace al archivo JavaScript separado -->
    <script src="js/contador.js"></script>
</body>
</html>
