<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Ella 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{ --bg-color:#0a0812; --texto-claro:#ffffff; box-sizing:border-box; }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; width:100%; min-height:100%;
    background:radial-gradient(circle at 50% 25%, #1a1526 0%, var(--bg-color) 70%);
    overflow-x:hidden; font-family:'Montserrat',sans-serif; color:var(--texto-claro);
    display:flex; flex-direction:column; align-items:center;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .section-inicio{ position:relative; width:100%; height:100vh; display:flex; justify-content:center; align-items:center; overflow:hidden; }
  .contenedor-lirio{ position:relative; width:92%; max-width:540px; height:88vh; max-height:760px; }
  svg{ width:100%; height:100%; filter:drop-shadow(0 0 25px rgba(244,166,198,0.3)); }

  .tallo{ stroke-dasharray:700; stroke-dashoffset:700; animation:dibujarTallo 4.4s cubic-bezier(.45,0,.15,1) forwards; }
  .hoja{ opacity:0; animation:aparecerFlor 2.2s ease 3.2s forwards; }
  .petalo{ transform-box:fill-box; transform-origin:50% 100%; opacity:0; animation:aparecerFlor 2.6s ease forwards, respirar 8s ease-in-out infinite; }
  .peca{ opacity:0; animation:aparecerFlor 1.8s ease forwards; }
  .estambre{ opacity:0; animation:aparecerFlor 1.8s ease forwards; }
  .lazo{ transform-box:fill-box; transform-origin:50% 50%; opacity:0; animation:aparecerLazo 2.2s cubic-bezier(.2,.8,.2,1) 6.4s forwards; }
  .flor-extra{ transform-box:fill-box; transform-origin:50% 100%; opacity:0; animation:aparecerFlor 2.6s ease forwards, respirar 8.5s ease-in-out infinite; animation-delay:4.2s,7s; }

  .petalo-trasero{ animation-delay:3.2s, 5.8s; }
  .petalo-delantero{ animation-delay:3.7s, 6.3s; }
  .petalo-centro{ animation-delay:4.2s, 6.8s; }
  .peca{ animation-delay:4.8s; }
  .estambre{ animation-delay:4.5s; }

  @keyframes dibujarTallo{ to{ stroke-dashoffset:0; } }
  @keyframes aparecerFlor{ to{ opacity:1; } }
  @keyframes aparecerLazo{ from{ opacity:0; transform:scale(.6); } to{ opacity:1; transform:scale(1); } }
  @keyframes respirar{ 0%,100%{ transform:scale(1) rotate(0deg); } 50%{ transform:scale(1.012) rotate(.3deg); } }

  .titulo-principal{
    position:absolute; bottom:5%; width:100%; text-align:center;
    font-family:'Playfair Display',serif; font-style:italic; font-size:2rem; letter-spacing:.5px;
    text-shadow:0 0 18px rgba(244,166,198,.6); opacity:0;
    animation:aparecerFlor 3s ease 8.5s forwards; pointer-events:none;
  }
  .petalo-caida{ position:absolute; width:14px; height:22px; border-radius:15px 0 15px 15px; top:-30px; z-index:0; opacity:.55; filter:blur(.5px); pointer-events:none; }
  .section-hidden{ display:none; }
</style>
</head>
<body>
  <div class="section-inicio">
    <div class="contenedor-lirio">
      <svg viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gradPetalo" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/><stop offset="45%" stop-color="#fde4ee"/><stop offset="100%" stop-color="#f2a3c6"/>
          </linearGradient>
          <linearGradient id="gradRaya" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#e8558f" stop-opacity=".9"/><stop offset="100%" stop-color="#f2a3c6" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="gradTallo" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#3f8f3a"/><stop offset="100%" stop-color="#7fd858"/>
          </linearGradient>
          <radialGradient id="gradSombraPetalo" cx="50%" cy="100%" r="75%">
            <stop offset="0%" stop-color="#c9628f" stop-opacity=".35"/><stop offset="100%" stop-color="#c9628f" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="gradRosaClaro" cx="50%" cy="60%" r="60%">
            <stop offset="0%" stop-color="#f9c2d6"/><stop offset="100%" stop-color="#e8558f"/>
          </radialGradient>
          <radialGradient id="gradRosaMedio" cx="50%" cy="60%" r="60%">
            <stop offset="0%" stop-color="#e0507e"/><stop offset="100%" stop-color="#b5265a"/>
          </radialGradient>
          <linearGradient id="gradLazo" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f06a95"/><stop offset="50%" stop-color="#d43d72"/><stop offset="100%" stop-color="#b5265a"/>
          </linearGradient>
          <filter id="blurSuave" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
          <filter id="sombraFlor" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3a0d20" flood-opacity="0.22"/></filter>

          <!-- LIRIO: origen (0,0) en la base donde se une al tallo -->
          <g id="lirio">
            <g filter="url(#sombraFlor)">
              <g filter="url(#blurSuave)" opacity=".92">
                <path class="petalo petalo-trasero" d="M0,10 C-55,-15 -88,-70 -82,-130 C-78,-168 -55,-185 -38,-172 C-52,-150 -50,-110 -40,-85 C-52,-92 -60,-80 -50,-60 C-30,-30 -10,-5 0,10 Z" fill="url(#gradPetalo)" stroke="#dba9c3" stroke-width="1.2"/>
                <path class="petalo petalo-trasero" d="M0,10 C55,-15 88,-70 82,-130 C78,-168 55,-185 38,-172 C52,-150 50,-110 40,-85 C52,-92 60,-80 50,-60 C30,-30 10,-5 0,10 Z" fill="url(#gradPetalo)" stroke="#dba9c3" stroke-width="1.2"/>
              </g>
              <path class="petalo petalo-delantero" d="M0,18 C-60,10 -105,-45 -108,-115 C-110,-160 -90,-195 -68,-198 C-78,-175 -70,-150 -50,-140 C-62,-155 -58,-172 -42,-170 C-48,-140 -35,-105 -18,-90 C-30,-95 -38,-75 -22,-55 C-8,-30 0,-5 0,18 Z" fill="url(#gradPetalo)" stroke="#e4b6cf" stroke-width="1.4"/>
              <path class="petalo petalo-delantero" d="M0,18 C60,10 105,-45 108,-115 C110,-160 90,-195 68,-198 C78,-175 70,-150 50,-140 C62,-155 58,-172 42,-170 C48,-140 35,-105 18,-90 C30,-95 38,-75 22,-55 C8,-30 0,-5 0,18 Z" fill="url(#gradPetalo)" stroke="#e4b6cf" stroke-width="1.4"/>
              <path class="petalo petalo-centro" d="M0,22 C-28,-5 -38,-90 -22,-160 C-15,-188 8,-192 12,-172 C0,-165 -6,-130 2,-95 C10,-120 20,-110 14,-80 C22,-90 18,-55 6,-20 C4,-8 2,10 0,22 Z" fill="url(#gradPetalo)" stroke="#e4b6cf" stroke-width="1.4"/>
              <ellipse cx="0" cy="-5" rx="70" ry="40" fill="url(#gradSombraPetalo)"/>
              <g stroke="#e79cbc" stroke-width=".6" opacity=".55" fill="none">
                <path d="M0,10 C-2,-50 -6,-110 -14,-165"/><path d="M0,10 C2,-50 6,-110 14,-165"/>
                <path d="M-6,10 C-18,-45 -35,-95 -55,-145"/><path d="M6,10 C18,-45 35,-95 55,-145"/>
              </g>
              <path d="M0,10 C-3,-55 -6,-120 -14,-175" fill="none" stroke="url(#gradRaya)" stroke-width="7" stroke-linecap="round"/>
              <path d="M-42,-5 C-50,-60 -62,-115 -78,-160" fill="none" stroke="url(#gradRaya)" stroke-width="5" stroke-linecap="round" opacity=".85"/>
              <path d="M42,-5 C50,-60 62,-115 78,-160" fill="none" stroke="url(#gradRaya)" stroke-width="5" stroke-linecap="round" opacity=".85"/>
              <g fill="#c23b6a">
                <ellipse class="peca" cx="-6" cy="-15" rx="2.4" ry="3.2" transform="rotate(-10 -6 -15)"/><ellipse class="peca" cx="9" cy="-22" rx="2" ry="2.8" transform="rotate(15 9 -22)"/>
                <ellipse class="peca" cx="-16" cy="-30" rx="2.3" ry="3" transform="rotate(-25 -16 -30)"/><ellipse class="peca" cx="15" cy="-38" rx="1.9" ry="2.6" transform="rotate(20 15 -38)"/>
                <ellipse class="peca" cx="-3" cy="-45" rx="2.1" ry="2.9"/><ellipse class="peca" cx="-28" cy="-25" rx="2" ry="2.7" transform="rotate(-15 -28 -25)"/>
                <ellipse class="peca" cx="30" cy="-22" rx="2" ry="2.7" transform="rotate(15 30 -22)"/><ellipse class="peca" cx="0" cy="-65" rx="1.6" ry="2.2"/>
                <ellipse class="peca" cx="-38" cy="-45" rx="1.5" ry="2"/><ellipse class="peca" cx="40" cy="-42" rx="1.5" ry="2"/>
              </g>
              <path d="M-15,18 C-11,-18 11,-18 15,18 C7,28 -7,28 -15,18 Z" fill="#eefabb" opacity=".95"/>
              <line x1="0" y1="8" x2="0" y2="-115" stroke="#a9d69a" stroke-width="3" stroke-linecap="round"/>
              <g fill="#8fb87a"><ellipse cx="-3" cy="-116" rx="3.5" ry="5" transform="rotate(-20 -3 -116)"/><ellipse cx="3" cy="-116" rx="3.5" ry="5" transform="rotate(20 3 -116)"/><ellipse cx="0" cy="-119" rx="3.5" ry="5"/></g>
              <g stroke="#cfe8b8" stroke-width="2.2" fill="none" stroke-linecap="round">
                <path class="estambre" d="M0,6 C-4,-35 -18,-65 -34,-86"/><path class="estambre" d="M0,6 C4,-36 20,-67 38,-88"/>
                <path class="estambre" d="M0,6 C-8,-32 -28,-52 -52,-64"/><path class="estambre" d="M0,6 C8,-33 30,-54 56,-64"/>
                <path class="estambre" d="M0,6 C-2,-40 2,-75 -6,-102"/><path class="estambre" d="M0,6 C2,-40 -2,-75 6,-104"/>
              </g>
              <g fill="#9b2036">
                <ellipse class="estambre" cx="-34" cy="-86" rx="5" ry="9" transform="rotate(-55 -34 -86)"/><ellipse class="estambre" cx="38" cy="-88" rx="5" ry="9" transform="rotate(55 38 -88)"/>
                <ellipse class="estambre" cx="-52" cy="-64" rx="4.6" ry="8" transform="rotate(-70 -52 -64)"/><ellipse class="estambre" cx="56" cy="-64" rx="4.6" ry="8" transform="rotate(70 56 -64)"/>
                <ellipse class="estambre" cx="-6" cy="-102" rx="4.8" ry="8.5" transform="rotate(-12 -6 -102)"/><ellipse class="estambre" cx="6" cy="-104" rx="4.8" ry="8.5" transform="rotate(12 6 -104)"/>
              </g>
            </g>
          </g>

          <!-- ROSA: origen (0,0) en la base, capullo centrado hacia (0,-50) -->
          <g id="rosa">
            <g filter="url(#sombraFlor)">
              <line x1="0" y1="0" x2="0" y2="-30" stroke="#4a8f3f" stroke-width="4" stroke-linecap="round"/>
              <g fill="url(#gradRosaClaro)" stroke="#a8244f" stroke-width="1">
                <path transform="rotate(0 0 -50)"   d="M0,-50 C-16,-72 -12,-96 0,-104 C12,-96 16,-72 0,-50 Z"/>
                <path transform="rotate(60 0 -50)"  d="M0,-50 C-16,-72 -12,-96 0,-104 C12,-96 16,-72 0,-50 Z"/>
                <path transform="rotate(120 0 -50)" d="M0,-50 C-16,-72 -12,-96 0,-104 C12,-96 16,-72 0,-50 Z"/>
                <path transform="rotate(180 0 -50)" d="M0,-50 C-16,-72 -12,-96 0,-104 C12,-96 16,-72 0,-50 Z"/>
                <path transform="rotate(240 0 -50)" d="M0,-50 C-16,-72 -12,-96 0,-104 C12,-96 16,-72 0,-50 Z"/>
                <path transform="rotate(300 0 -50)" d="M0,-50 C-16,-72 -12,-96 0,-104 C12,-96 16,-72 0,-50 Z"/>
              </g>
              <g fill="url(#gradRosaMedio)" stroke="#8f1c46" stroke-width="1">
                <path transform="rotate(30 0 -50)"  d="M0,-50 C-10,-66 -8,-82 0,-88 C8,-82 10,-66 0,-50 Z"/>
                <path transform="rotate(102 0 -50)" d="M0,-50 C-10,-66 -8,-82 0,-88 C8,-82 10,-66 0,-50 Z"/>
                <path transform="rotate(174 0 -50)" d="M0,-50 C-10,-66 -8,-82 0,-88 C8,-82 10,-66 0,-50 Z"/>
                <path transform="rotate(246 0 -50)" d="M0,-50 C-10,-66 -8,-82 0,-88 C8,-82 10,-66 0,-50 Z"/>
                <path transform="rotate(318 0 -50)" d="M0,-50 C-10,-66 -8,-82 0,-88 C8,-82 10,-66 0,-50 Z"/>
              </g>
              <path d="M0,-50 C-7,-59 -5,-70 4,-68 C11,-66 9,-57 0,-50 Z" fill="#8a1638" stroke="#5c0d27" stroke-width=".6"/>
              <path d="M0,-52 C4,-58 8,-62 4,-68 C0,-70 -4,-66 -2,-60 Z" fill="#6e0f2e" opacity=".85"/>
              <path d="M-30,-95 C-24,-100 -16,-100 -12,-95" fill="none" stroke="#ffe6ef" stroke-width="2" opacity=".55"/>
            </g>
          </g>

          <!-- FLOR PEQUEÑA DE RELLENO: origen (0,0) en la base -->
          <g id="florRelleno">
            <line x1="0" y1="0" x2="0" y2="-12" stroke="#5fae4a" stroke-width="2" stroke-linecap="round"/>
            <g fill="#fff8ec" stroke="#e8dcc0" stroke-width=".5">
              <ellipse cx="0" cy="-22" rx="4.5" ry="6.5" transform="rotate(0 0 -14)"/>
              <ellipse cx="0" cy="-22" rx="4.5" ry="6.5" transform="rotate(72 0 -14)"/>
              <ellipse cx="0" cy="-22" rx="4.5" ry="6.5" transform="rotate(144 0 -14)"/>
              <ellipse cx="0" cy="-22" rx="4.5" ry="6.5" transform="rotate(216 0 -14)"/>
              <ellipse cx="0" cy="-22" rx="4.5" ry="6.5" transform="rotate(288 0 -14)"/>
            </g>
            <circle cx="0" cy="-14" r="3" fill="#f6d34a"/>
          </g>
        </defs>

        <!-- TALLOS: suben desde cada flor, se cruzan levemente y convergen en el lazo -->
        <g fill="none" stroke="url(#gradTallo)" stroke-width="5.5" stroke-linecap="round">
          <path class="tallo" d="M140,310 C170,370 220,420 258,478"/>
          <path class="tallo" d="M300,235 C285,330 265,410 260,478"/>
          <path class="tallo" d="M410,310 C370,370 300,420 262,478"/>
          <path class="tallo" d="M210,350 C225,390 245,430 258,478"/>
          <path class="tallo" d="M350,355 C325,400 285,435 262,478"/>
        </g>
        <!-- tallos cortados por debajo del lazo, abriéndose en abanico -->
        <g fill="none" stroke="url(#gradTallo)" stroke-width="5" stroke-linecap="round">
          <path class="tallo" d="M258,488 C230,540 205,580 188,622"/>
          <path class="tallo" d="M260,488 C248,545 235,595 228,638"/>
          <path class="tallo" d="M260,488 C260,545 260,600 260,648"/>
          <path class="tallo" d="M262,488 C275,545 288,595 294,638"/>
          <path class="tallo" d="M262,488 C290,540 315,580 332,622"/>
        </g>

        <!-- HOJAS y ramitas verdes entre las flores -->
        <path class="hoja" d="M170,360 C100,345 90,300 130,312 C122,332 138,352 170,360 Z" fill="#4f9c46" stroke="#2f6b2b" stroke-width="1"/>
        <path class="hoja" d="M370,368 C440,352 450,308 410,320 C418,340 402,360 370,368 Z" fill="#5aab4f" stroke="#2f6b2b" stroke-width="1"/>
        <path class="hoja" d="M255,430 C235,470 240,510 260,470 Z" fill="#5aab4f" stroke="#2f6b2b" stroke-width=".8"/>

        <!-- FLORES: traseras y pequeñas primero, luego las principales al frente -->
        <g class="flor-extra"><use href="#florRelleno" transform="translate(90,330) rotate(8) scale(1)"/></g>
        <g class="flor-extra"><use href="#florRelleno" transform="translate(450,330) rotate(-8) scale(1)"/></g>
        <g class="flor-extra"><use href="#florRelleno" transform="translate(250,190) scale(.9)"/></g>
        <g class="flor-extra"><use href="#florRelleno" transform="translate(330,170) rotate(14) scale(.85)"/></g>
        <g class="flor-extra"><use href="#florRelleno" transform="translate(170,220) rotate(-10) scale(.8)"/></g>
        <g class="flor-extra"><use href="#florRelleno" transform="translate(390,235) rotate(10) scale(.8)"/></g>

        <use href="#lirio" transform="translate(140,310) rotate(-32) scale(.72)"/>
        <use href="#lirio" transform="translate(410,310) rotate(26) scale(.7)"/>
        <g class="flor-extra"><use href="#rosa" transform="translate(210,350) rotate(-14) scale(.95)"/></g>
        <g class="flor-extra"><use href="#rosa" transform="translate(350,355) rotate(16) scale(.9)"/></g>
        <use href="#lirio" transform="translate(300,235) rotate(-8) scale(1.05)"/>

        <!-- LAZO que une los tallos, ajustado al grosor real del ramo -->
        <g transform="translate(260,481)">
        <g class="lazo">
          <!-- cinta que envuelve el haz de tallos -->
          <path d="M-46,-13 C-20,-22 20,-22 46,-13 L46,6 C46,15 20,20 0,20 C-20,20 -46,15 -46,6 Z" fill="url(#gradLazo)" stroke="#8f1c46" stroke-width="1.4"/>
          <path d="M-46,-13 C-20,-22 20,-22 46,-13" fill="none" stroke="#ffd7e6" stroke-width="1.4" opacity=".5"/>

          <!-- colas del lazo, cayendo sobre dos de los tallos del abanico -->
          <path d="M-10,10 C-24,45 -34,85 -50,118 L-30,122 C-18,90 -10,55 4,14 Z" fill="url(#gradLazo)" stroke="#8f1c46" stroke-width="1.1"/>
          <path d="M10,10 C24,45 34,85 50,118 L30,122 C18,90 10,55 -4,14 Z" fill="url(#gradLazo)" stroke="#8f1c46" stroke-width="1.1"/>
          <path d="M-32,110 L-50,118 L-38,128 Z" fill="url(#gradLazo)" stroke="#8f1c46" stroke-width="1"/>
          <path d="M32,110 L50,118 L38,128 Z" fill="url(#gradLazo)" stroke="#8f1c46" stroke-width="1"/>

          <!-- lazadas del moño, centradas sobre la cinta -->
          <path d="M-8,-4 C-40,-30 -62,-14 -46,8 C-34,24 -14,14 -8,-4 Z" fill="url(#gradLazo)" stroke="#8f1c46" stroke-width="1.4"/>
          <path d="M8,-4 C40,-30 62,-14 46,8 C34,24 14,14 8,-4 Z" fill="url(#gradLazo)" stroke="#8f1c46" stroke-width="1.4"/>
          <path d="M-32,-16 C-20,-19 -8,-13 -6,-4" fill="none" stroke="#ffe6ef" stroke-width="1.6" opacity=".6"/>
          <path d="M32,-16 C20,-19 8,-13 6,-4" fill="none" stroke="#ffe6ef" stroke-width="1.6" opacity=".6"/>

          <!-- nudo central -->
          <ellipse cx="0" cy="0" rx="11" ry="9" fill="#f06a95" stroke="#8f1c46" stroke-width="1.4"/>
        </g>
        </g>
      </svg>
      <div class="titulo-principal">Un ramo para ti 💐</div>
    </div>
  </div>

  <div class="section-hidden" id="cronologia"><h2>Nuestra Historia</h2></div>

  <script>
    function crearPetalo(){
      const p=document.createElement('div');
      p.classList.add('petalo-caida');
      p.style.left=Math.random()*window.innerWidth+'px';
      p.style.animationDuration=(Math.random()*6+9)+'s';
      p.style.animationName='caer';
      p.style.animationTimingFunction='linear';
      p.style.animationFillMode='forwards';
      const size=Math.random()*8+10;
      p.style.width=size+'px';
      p.style.height=(size*1.6)+'px';
      const hue=330+Math.random()*20;
      p.style.backgroundColor=`hsl(${hue},70%,88%)`;
      document.body.appendChild(p);
      setTimeout(()=>p.remove(),16000);
    }
    const styleSheet=document.createElement('style');
    styleSheet.textContent=`@keyframes caer{ to{ transform:translateY(110vh) rotate(300deg); opacity:0; } }`;
    document.head.appendChild(styleSheet);

    let intervaloPetalos;
    const observer=new IntersectionObserver((entries)=>{
      if(entries[0].isIntersecting){ intervaloPetalos=setInterval(crearPetalo,900); }
      else{ clearInterval(intervaloPetalos); }
    });
    observer.observe(document.querySelector('.section-inicio'));
  </script>
</body>
</html>
