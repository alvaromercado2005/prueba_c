<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ella 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080810; /* Fondo muy oscuro */
            --lirio-petalo: #e0c3fc;
            --lirio-petalo-oscuro: #b19cd9;
            --lirio-centro: #fff9c4;
            --lirio-tallo: #76ff03; /* Verde más vivo y natural */
            --texto-claro: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            min-height: 100vh;
            background-color: var(--bg-color);
            overflow-x: hidden;
            font-family: 'Montserrat', sans-serif;
            color: var(--texto-claro);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- SECCIÓN INICIO (Flor) --- */
        .section-inicio {
            position: relative;
            width: 100%;
            height: 100vh; /* Ocupa toda la pantalla */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenedor-lirio {
            position: relative;
            width: 90%;
            max-width: 450px;
            height: 80vh;
            max-height: 600px;
        }

        svg {
            width: 100%;
            height: 100%;
            /* Sutil brillo alrededor de toda la flor */
            filter: drop-shadow(0 0 15px rgba(224, 195, 252, 0.3));
        }

        /* Animaciones mejoradas */
        .tallo {
            stroke-dasharray: 500;
            stroke-dashoffset: 500;
            animation: dibujarTallo 2.5s ease forwards;
        }

        .hoja {
            opacity: 0;
            animation: aparecerFlor 1s ease 2s forwards;
        }

        .petalo {
            transform-origin: center bottom;
            opacity: 0;
            animation: aparecerFlor 1s ease forwards, respirar 4s ease-in-out infinite;
        }
        
        /* Retrasos para que la flor "abra" */
        .petalo-trasero { animation-delay: 1.5s, 2.5s; }
        .petalo-delantero { animation-delay: 1.7s, 2.7s; }
        .petalo-centro { animation-delay: 1.9s, 2.9s; }

        @keyframes dibujarTallo { to { stroke-dashoffset: 0; } }
        @keyframes aparecerFlor { to { opacity: 1; } }
        @keyframes respirar {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.02) rotate(0.5deg); }
        }

        .titulo-principal {
            position: absolute;
            bottom: 15%;
            width: 100%;
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            opacity: 0;
            animation: aparecerFlor 2s ease 3s forwards;
            pointer-events: none;
        }

        /* --- Lluvia de pétalos (JS) --- */
        .petalo-caida {
            position: absolute;
            background-color: var(--lirio-petalo);
            width: 15px;
            height: 25px;
            border-radius: 15px 0 15px 15px;
            top: -30px;
            z-index: -1;
            opacity: 0.6;
            filter: blur(1px);
        }

        /* --- SECCIONES SIGUIENTES (Ocultas de momento) --- */
        .section-hidden {
            display: none; /* Cambiar a 'block' cuando se quiera mostrar */
            width: 100%;
            padding: 50px 20px;
            background: #fff;
            color: #333;
        }

    </style>
</head>
<body>

    <!-- SECCIÓN 1: INICIO (LA FLOR) -->
    <div class="section-inicio">
        <div class="contenedor-lirio">
            <svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="gradPetalo" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#e0c3fc;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#d8b4e2;stop-opacity:1" />
                    </linearGradient>
                    <linearGradient id="gradTallo" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#66bb6a;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#76ff03;stop-opacity:1" />
                    </linearGradient>
                </defs>

                <!-- NUEVO DISEÑO DE HOJAS Y TALLO -->
                <!-- Tallo principal más curvo y grueso -->
                <path class="tallo" d="M200,550 C180,400 220,300 195,200" fill="none" stroke="url(#gradTallo)" stroke-width="7" stroke-linecap="round"/>
                
                <!-- Hoja 1 (Inferior izquierda, más grande y orgánica) -->
                <path class="hoja" d="M196,450 C100,420 120,350 160,380 C140,400 150,430 196,450 Z" fill="#66bb6a" stroke="#388e3c" stroke-width="1"/>
                
                <!-- Hoja 2 (Media derecha, curvada hacia arriba) -->
                <path class="hoja" d="M198,350 C280,320 270,250 210,280 C230,300 220,330 198,350 Z" fill="#66bb6a" stroke="#388e3c" stroke-width="1"/>

                <!-- FLOR (Similar pero mejor situada) -->
                <!-- Grupo de Estambres -->
                <g transform="translate(195, 195) scale(0.9)">
                    <line x1="0" y1="0" x2="0" y2="-100" stroke="#a5d6a7" stroke-width="4"/>
                    <circle cx="0" cy="-105" r="7" fill="#fff9c4" stroke="#fbc02d" stroke-width="2"/>
                    <line x1="-20" y1="-10" x2="-30" y2="-90" stroke="#a5d6a7" stroke-width="3"/>
                    <ellipse cx="-30" cy="-90" rx="7" ry="12" fill="#fff9c4" stroke="#fbc02d"/>
                    <line x1="20" y1="-10" x2="30" y2="-90" stroke="#a5d6a7" stroke-width="3"/>
                    <ellipse cx="30" cy="-90" rx="7" ry="12" fill="#fff9c4" stroke="#fbc02d"/>
                </g>

                <!-- Pétalos (Más definidos y con puntas elegantes) -->
                <g transform="translate(0, -10)">
                    <!-- Traseros -->
                    <path class="petalo petalo-trasero" d="M195,200 C150,130 100,160 130,80 C160,10 200,60 195,200 Z" fill="url(#gradPetalo)" stroke="#b19cd9"/>
                    <path class="petalo petalo-trasero" d="M205,200 C250,130 300,160 270,80 C240,10 200,60 205,200 Z" fill="url(#gradPetalo)" stroke="#b19cd9"/>
                    <!-- Delanteros -->
                    <path class="petalo petalo-delantero" d="M185,200 C140,280 90,240 120,150 C140,60 190,130 185,200 Z" fill="url(#gradPetalo)" stroke="#b19cd9"/>
                    <path class="petalo petalo-delantero" d="M215,200 C260,280 310,240 280,150 C260,60 210,130 215,200 Z" fill="url(#gradPetalo)" stroke="#b19cd9"/>
                    <!-- Central -->
                    <path class="petalo petalo-centro" d="M200,180 C170,260 230,260 200,180 Z" fill="url(#gradPetalo)" stroke="#b19cd9" style="animation-delay: 1.9s, 2.9s;"/>
                </g>
            </svg>
            <div class="titulo-principal">Para mi amor...</div>
        </div>
    </div>

    <!-- SECCIÓN 2: CRONOLOGÍA (Estructura preparada) -->
    <div class="section-hidden" id="cronologia">
        <h2>Nuestra Historia</h2>
        <!-- Aquí iría la línea de tiempo -->
    </div>

    <!-- SCRIPT LLUVIA -->
    <script>
        function crearPetalo() {
            const petalo = document.createElement('div');
            petalo.classList.add('petalo-caida');
            petalo.style.left = Math.random() * window.innerWidth + 'px';
            petalo.style.animationDuration = (Math.random() * 5 + 5) + 's';
            const size = Math.random() * 10 + 10;
            petalo.style.width = size + 'px';
            petalo.style.height = size * 1.7 + 'px';
            const hue = Math.random() * 20 + 260;
            petalo.style.backgroundColor = `hsl(${hue}, 60%, 80%)`;
            document.body.appendChild(petalo);
            setTimeout(() => { petalo.remove(); }, 10000);
        }
        // Solo crear pétalos si estamos en la sección de inicio
        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting) {
                intervaloPetalos = setInterval(crearPetalo, 400);
            } else {
                clearInterval(intervaloPetalos);
            }
        });
        observer.observe(document.querySelector('.section-inicio'));
        let intervaloPetalos;
    </script>
</body>
</html>
