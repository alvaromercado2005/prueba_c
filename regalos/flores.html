<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lirio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap">
<style>
:root{--bg1:#eaf3fc;--bg2:#bcd7f1;--ink:#1f3550;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#eaf3fc;--bg2:#bcd7f1;--ink:#1f3550}}
:root[data-theme="dark"]{--bg1:#eaf3fc;--bg2:#bcd7f1;--ink:#1f3550}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 40%,var(--bg1),var(--bg2));color:var(--ink);font-family:"Fraunces",Georgia,serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.pal{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;gap:8px;justify-content:center}
button{font:inherit;font-size:.95rem;color:var(--ink);background:transparent;border:1px solid currentColor;border-radius:999px;padding:6px 16px;cursor:pointer;opacity:.7}
button[aria-pressed="true"]{opacity:1;background:var(--ink);color:var(--bg1)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* ===== Intro antes del ramo ===== */
#intro{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 45%,#2b0a1d 0%,#16050f 45%,#050104 80%,#000 100%);display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;outline:none;transition:opacity 2.5s ease}
#intro.fuera{opacity:0;pointer-events:none}
#intro.rapido{transition-duration:1.4s}
#petalos{position:fixed;inset:0;width:100%;height:100%;z-index:55;pointer-events:none;transition:opacity 3s ease}
.intro-abrir{text-align:center;padding:0 24px;transition:opacity 1s ease,transform 1s ease}
.intro-abrir.fuera{opacity:0;transform:translateY(-12px)}
.intro-abrir p{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:clamp(1.9rem,8vw,2.7rem);color:#F3E9D2;animation:latir 3.2s ease-in-out infinite}
@keyframes latir{0%,100%{opacity:.8;text-shadow:0 0 6px rgba(243,233,210,.2),0 0 16px rgba(243,233,210,.08)}50%{opacity:1;text-shadow:0 0 12px rgba(243,233,210,.6),0 0 32px rgba(244,167,185,.35)}}
.intro-flor{display:block;width:28px;height:28px;margin:16px auto 0;opacity:.8}
.intro-texto{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);padding:0 28px;text-align:center;pointer-events:none}
.intro-linea{margin:0 auto .4em;max-width:560px;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:clamp(1.4rem,6vw,2.1rem);line-height:1.4;color:#F3E9D2;text-shadow:0 0 14px rgba(243,233,210,.22);opacity:0;transform:translateY(14px);transition:opacity 1.8s ease,transform 1.8s ease}
.intro-linea.ver{opacity:1;transform:none}
.intro-fecha{margin-top:1.5em;font-size:clamp(.95rem,3.8vw,1.15rem);letter-spacing:.3em}
.intro-fecha.ver{opacity:.75}
/* --- Controles: sonido y volver al menú --- */
.ctrl{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));z-index:70;opacity:0;pointer-events:none;transition:opacity 1s ease,color .8s ease,background .8s ease,border-color .8s ease;-webkit-tap-highlight-color:transparent}
.ctrl.ver{opacity:.85;pointer-events:auto}
.ctrl.ver:hover{opacity:1}
#btnSonido{right:14px;width:40px;height:40px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#F3E9D2;background:rgba(255,255,255,.08);border:1px solid rgba(243,233,210,.35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#btnSonido svg{width:20px;height:20px}
#btnSonido .on-x{display:none}
#btnSonido[aria-pressed="true"] .on-x{display:inline}
#btnSonido[aria-pressed="true"] .on-ondas{display:none}
#btnMenu{left:14px;font-family:'Montserrat',sans-serif;font-size:.85rem;padding:8px 15px;border-radius:999px;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.6);border:1px solid rgba(31,53,80,.2);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
body.ramo-visible #btnSonido{color:var(--ink);background:rgba(255,255,255,.6);border-color:rgba(31,53,80,.2)}
</style>
</head>
<body>
<canvas id="c" aria-label="Lirio en 3D"></canvas>
<div id="intro" role="button" tabindex="0" aria-label="Toca para abrir">
  <div class="intro-abrir">
    <p>Toca para abrir</p>
    <svg class="intro-flor" viewBox="0 0 24 24" aria-hidden="true"><g fill="#F3E9D2" opacity=".85"><ellipse cx="12" cy="6.6" rx="3" ry="4.8"/><ellipse cx="12" cy="6.6" rx="3" ry="4.8" transform="rotate(72 12 12)"/><ellipse cx="12" cy="6.6" rx="3" ry="4.8" transform="rotate(144 12 12)"/><ellipse cx="12" cy="6.6" rx="3" ry="4.8" transform="rotate(216 12 12)"/><ellipse cx="12" cy="6.6" rx="3" ry="4.8" transform="rotate(288 12 12)"/></g><circle cx="12" cy="12" r="2.4" fill="#f4a7b9"/></svg>
  </div>
  <div class="intro-texto" aria-live="polite">
    <p class="intro-linea">Llevabas mucho, mucho tiempo sin verlo…</p>
    <p class="intro-linea">pero desde hoy podrás verlo para siempre,</p>
    <p class="intro-linea">como el primer día.</p>
    <p class="intro-linea intro-fecha">29 · 06 · 2026</p>
  </div>
</div>
<canvas id="petalos" aria-hidden="true"></canvas>
<audio id="cancion" src="../fotos/cancion.mp3" preload="auto"></audio>
<button id="btnSonido" class="ctrl" type="button" aria-label="Silenciar música" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" stroke="none"/><path class="on-ondas" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="on-x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
<a id="btnMenu" class="ctrl" href="../menu.html">‹ Menú</a>
<script>
// ===== Intro antes del ramo: pétalos, texto, música y transición =====
(function(){
  const T2=Math.PI*2;
  const intro=document.getElementById('intro'),abrir=intro.querySelector('.intro-abrir');
  const lineas=[...intro.querySelectorAll('.intro-linea')];
  const btnS=document.getElementById('btnSonido'),btnM=document.getElementById('btnMenu');
  const pc=document.getElementById('petalos'),ctx=pc.getContext('2d');
  const reduceI=matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- Pétalos cayendo ----------
  let W=0,H=0;
  function tam(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;pc.width=W*d;pc.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
  addEventListener('resize',tam);tam();
  const COLS=['#f4a7b9','#f7c6d1','#ec8fa8','#F3E9D2','#fbefe2'];
  let recicla=true,vivos=true;
  function nuevo(p,arriba){
    p.x0=Math.random()*W;p.y=arriba?-20-Math.random()*H*0.25:Math.random()*H;
    p.s=8+Math.random()*9;p.v=16+Math.random()*24;p.amp=14+Math.random()*30;p.f=0.25+Math.random()*0.45;
    p.ph=Math.random()*T2;p.rot=Math.random()*T2;p.vr=(Math.random()-0.5)*1.1;p.fl=Math.random()*T2;p.vf=0.8+Math.random()*1.4;
    p.c=COLS[Math.floor(Math.random()*COLS.length)];p.a=0.4+Math.random()*0.35;p.dead=false;return p;
  }
  const pet=[];for(let i=0;i<18;i++)pet.push(nuevo({},false));
  function petalo(p){
    const w=p.s*0.55,h=p.s;
    ctx.save();ctx.translate(p.x0+Math.sin(p.ph)*p.amp,p.y);ctx.rotate(p.rot);
    ctx.scale(Math.max(0.15,Math.abs(Math.cos(p.fl))),1);   // volteo: da sensación de giro en 3D
    ctx.globalAlpha=p.a;ctx.fillStyle=p.c;
    ctx.beginPath();ctx.moveTo(0,-h);
    ctx.bezierCurveTo(w,-h*0.7,w*0.85,h*0.55,0,h);
    ctx.bezierCurveTo(-w*0.85,h*0.55,-w,-h*0.7,0,-h);
    ctx.fill();ctx.restore();
  }
  let tp=performance.now();
  function caer(now){
    if(!vivos)return;
    const dt=Math.min(0.05,(now-tp)/1000);tp=now;
    ctx.clearRect(0,0,W,H);
    let quedan=0;
    for(const p of pet){
      if(p.dead)continue;
      p.y+=p.v*dt;p.ph+=p.f*dt;p.rot+=p.vr*dt;p.fl+=p.vf*dt;
      if(p.y>H+30){if(recicla)nuevo(p,true);else{p.dead=true;continue;}}
      petalo(p);quedan++;
    }
    if(quedan)requestAnimationFrame(caer);
  }
  requestAnimationFrame(caer);

  // ---------- Música: ../fotos/cancion.mp3, del segundo INI al FIN, una sola vez por cada visita ----------
  const VOL=0.4,INI=35,FIN=90,VECES=1;   // VECES: cuántas veces suena el tramo en total
  // si se vuelve a la página con el botón "atrás", se recarga para que la intro y la canción empiecen de nuevo
  addEventListener('pageshow',e=>{if(e.persisted)location.reload();});
  const audio=document.getElementById('cancion');
  let muted=false,fallo=false,vueltas=1,terminada=false;
  audio.addEventListener('error',()=>{fallo=true;});   // si no carga, todo sigue sin música
  function reproducir(){try{const p=audio.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
  // vuelve al segundo INI (o un poco antes del final si la canción es más corta)
  function aInicio(){try{audio.currentTime=Math.min(INI,(audio.duration||INI+1)-1);}catch(e){}}
  // al acabar el tramo: lo repite si quedan vueltas; si no, la canción se para
  function finTramo(){
    if(terminada)return;
    if(vueltas<VECES){vueltas++;aInicio();reproducir();}
    else{terminada=true;audio.pause();}
  }
  audio.addEventListener('timeupdate',()=>{if(audio.currentTime>=FIN)finTramo();});
  audio.addEventListener('ended',finTramo);
  function iniciarMusica(){
    if(fallo)return;
    try{
      audio.volume=0;audio.muted=muted;
      if(audio.readyState>=1)aInicio();else audio.addEventListener('loadedmetadata',aInicio,{once:true});
    }catch(e){}
    reproducir();
    // fundido de entrada de 3 s hasta el 40 %
    const ts=performance.now();
    const subir=setInterval(()=>{
      const k=Math.min(1,(performance.now()-ts)/3000);
      try{audio.volume=VOL*k;}catch(e){}
      if(k>=1)clearInterval(subir);
    },50);
    document.addEventListener('visibilitychange',()=>{if(document.hidden)audio.pause();else if(!fallo&&!terminada)reproducir();});
  }
  btnS.addEventListener('click',()=>{
    muted=!muted;
    btnS.setAttribute('aria-pressed',muted);
    btnS.setAttribute('aria-label',muted?'Activar música':'Silenciar música');
    audio.muted=muted;
  });

  // ---------- Secuencia ----------
  let estado='espera',saltado=false,revelado=false,revTimer=0,tInicio=0;const timers=[];
  // el ramo está listo cuando su script ha terminado de construirlo
  function listo(){try{return typeof SAT!=='undefined'&&typeof world!=='undefined';}catch(e){return false;}}
  function empezar(){
    estado='texto';tInicio=performance.now();
    abrir.classList.add('fuera');
    [1200,3900,6600,9200].forEach((ms,i)=>timers.push(setTimeout(()=>lineas[i].classList.add('ver'),ms)));
    timers.push(setTimeout(intentar,11800));
    btnS.classList.add('ver');
    try{iniciarMusica();}catch(e){}   // la música nunca frena la animación del texto
  }
  function intentar(){
    if(estado!=='texto')return;
    if(listo()||performance.now()-tInicio>30000){estado='revelando';revTimer=setTimeout(revelar,saltado?0:2000);}
    else setTimeout(intentar,200);
  }
  function revelar(){
    if(revelado)return;revelado=true;
    if(saltado)intro.classList.add('rapido');
    const dur=saltado?1400:2500;
    // el ramo da una vuelta suave hasta quedar de frente
    if(listo()&&!reduceI){
      world.rotation.y=-T2;
      const ts=performance.now(),D=dur+900;
      (function girar(){
        try{if(drag)return;}catch(e){}   // si se toca el ramo, deja de girar solo
        const k=Math.min(1,(performance.now()-ts)/D),e=k<0.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
        world.rotation.y=-T2*(1-e);
        if(k<1)requestAnimationFrame(girar);
      })();
    }
    intro.classList.add('fuera');
    setTimeout(()=>{
      intro.style.display='none';
      document.body.classList.add('ramo-visible');
      btnM.classList.add('ver');
      recicla=false;   // los pétalos que quedan terminan de caer y desaparecen
      setTimeout(()=>{pc.style.opacity='0';},2500);
      setTimeout(()=>{vivos=false;pc.remove();},5600);
    },dur);
  }
  function tocar(){
    if(estado==='espera')empezar();
    else if(estado==='texto'){saltado=true;timers.forEach(clearTimeout);intentar();}
    else if(estado==='revelando'&&!revelado){saltado=true;clearTimeout(revTimer);revelar();}
  }
  intro.addEventListener('click',tocar);
  intro.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tocar();}});
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const TAU=Math.PI*2;
const STEM_LEAVES=false;   // hojas pegadas a los tallos de cada flor: desactivadas (el verde viene de las ramitas de ruscus)
const TOUCH_FULL_RES=true;   // true = en pantallas táctiles se usa la misma resolución que en ordenador; false = vuelve a bajarla un 35 %
const LOWQ=!TOUCH_FULL_RES&&matchMedia('(pointer: coarse)').matches;
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,1,0.1,100);
scene.add(new THREE.HemisphereLight(0xfff9f0,0xebe0cc,0.5));
scene.add(new THREE.AmbientLight(0xfff4e6,0.14));
const key=new THREE.DirectionalLight(0xfff6ea,0.5);key.position.set(-3,6,5);scene.add(key);
const SHADOWS=true;   // sombras suaves entre las flores; pon false si va lento
if(SHADOWS&&renderer.shadowMap){
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  key.castShadow=true;key.target.position.set(0,1.5,0);scene.add(key.target);
  const sm=matchMedia('(pointer: coarse)').matches?1024:2048;key.shadow.mapSize.set(sm,sm);
  const sc_=key.shadow.camera;sc_.left=-9;sc_.right=9;sc_.top=9;sc_.bottom=-9;sc_.near=0.5;sc_.far=32;
  key.shadow.bias=-0.0006;key.shadow.normalBias=0.025;
}
const fill=new THREE.DirectionalLight(0xe9efff,0.35);fill.position.set(5,1,3);scene.add(fill);
const back=new THREE.DirectionalLight(0xfff0d8,0.25);back.position.set(-3,3,-5);scene.add(back);
const under=new THREE.DirectionalLight(0xfff4e0,0.3);under.position.set(1,-4,5);scene.add(under);

let seed=5;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const sph=new THREE.SphereGeometry(1,14,10);
const std=(c,r=0.7)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
function ell(mat,sx,sy,sz){const m=new THREE.Mesh(sph,mat);m.scale.set(sx,sy,sz);return m}

// Superficie curva de un tépalo u hoja: u = largo, v = ancho
function petalGeo(o){
  const L=o.L,W=o.W,sd=o.seed||0;
  let nu=o.nu||(o.W<0.16?24:36),nv=o.nv||(o.W<0.16?6:14);
  if(LOWQ){nu=Math.max(8,2*Math.round(nu*0.65/2));nv=Math.max(4,2*Math.round(nv*0.65/2));}
  const pos=[],uv=[],idx=[],cl=[];
  let cx=0,cy=0;
  const us=[];for(let i=0;i<=nu;i++){const s0=i/nu;us.push((o.strap||o.fan||o.spoon||o.round)?1-Math.pow(1-s0,1.7):s0);}
  for(let i=0;i<=nu;i++){
    const u=us[i],phi=o.phi0+o.curl*Math.pow(u,1.6);
    cl.push([cx,cy,phi]);
    const du=i<nu?us[i+1]-us[i]:0;
    cx+=Math.sin(phi)*L*du;cy+=Math.cos(phi)*L*du;
  }
  for(let i=0;i<=nu;i++){
    const u=us[i],px=cl[i][0],py=cl[i][1],phi=cl[i][2];
    const w=o.round?W*Math.sqrt(Math.max(0,1-Math.pow(u,6)))*(0.62+0.38*Math.min(1,u*4)):o.spoon?W*(0.5+0.5*Math.pow(Math.min(1,u*1.7),1.1))*Math.sqrt(Math.max(0,1-Math.pow(u,2.6))):o.fan?W*(0.12+0.88*Math.pow(u,0.6))*Math.sqrt(Math.max(0,1-Math.pow(u,o.tipP||4.5))):o.strap?W*Math.sqrt(Math.max(0,1-Math.pow(u,5)))*(0.55+0.45*Math.min(1,u*4))
      :W*(Math.pow(Math.abs(Math.sin(Math.PI*Math.pow(u,0.8))),0.8)*0.92+0.08*(1-u));
    const nx=-Math.cos(phi),ny=Math.sin(phi);
    for(let j=0;j<=nv;j++){
      const v=-1+2*j/nv;
      const off=o.cup*w*v*v*(1-(o.cupDecay||1.5)*u)+(o.roll||0)*w*Math.pow(Math.abs(v),1.5)*Math.exp(-u*5)
        +o.wave*Math.sin(u*(o.wf||20)+sd*3+v*2)*v*v*Math.min(1,u*3)
        -(o.crease||0.025)*Math.exp(-v*v*25)*(1-(o.spoon?0.6:1)*u)+(o.fan?o.wave*0.35*Math.sin(v*4.5+sd*2)*u*u:0);
      pos.push(px+nx*off,py+ny*off,v*w);
      uv.push((v+1)/2,u);
    }
  }
  const build=flip=>{
    idx.length=0;
    for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){
      const a=i*(nv+1)+j,b=a+1,c=a+nv+1,d=c+1;
      if(flip)idx.push(a,b,c,b,d,c);else idx.push(a,c,b,b,c,d);
    }
  };
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  build(false);geo.setIndex(idx.slice());geo.computeVertexNormals();
  // la cara "front" debe mirar hacia el interior de la flor
  const m=(nu/2)*(nv+1)+nv/2,ph=cl[nu/2][2],na=geo.attributes.normal;
  if(na.getX(m)*(-Math.cos(ph))+na.getY(m)*Math.sin(ph)<0){build(true);geo.setIndex(idx.slice());geo.computeVertexNormals();}
  if(o.thick){
    const nr=geo.attributes.normal,P=geo.attributes.position,n0=P.count,th=o.thick*0.5;
    const pp=new Float32Array(n0*6),uu=new Float32Array(n0*4),I=geo.index,ix=[];
    for(let i=0;i<n0;i++){
      pp[i*3]=P.getX(i)+nr.getX(i)*th;pp[i*3+1]=P.getY(i)+nr.getY(i)*th;pp[i*3+2]=P.getZ(i)+nr.getZ(i)*th;
      pp[(n0+i)*3]=P.getX(i)-nr.getX(i)*th;pp[(n0+i)*3+1]=P.getY(i)-nr.getY(i)*th;pp[(n0+i)*3+2]=P.getZ(i)-nr.getZ(i)*th;
      uu[i*2]=uu[(n0+i)*2]=uv[i*2];uu[i*2+1]=uu[(n0+i)*2+1]=uv[i*2+1];
    }
    for(let t=0;t<I.count;t+=3){ix.push(I.getX(t),I.getX(t+1),I.getX(t+2));ix.push(n0+I.getX(t),n0+I.getX(t+2),n0+I.getX(t+1));}
    const edge=(a,b)=>{ix.push(a,b,n0+b,a,n0+b,n0+a);};
    for(let i=0;i<nu;i++){edge(i*(nv+1),(i+1)*(nv+1));edge(i*(nv+1)+nv,(i+1)*(nv+1)+nv);}
    for(let j=0;j<nv;j++){edge(j,j+1);edge(nu*(nv+1)+j,nu*(nv+1)+j+1);}
    const g2=new THREE.BufferGeometry();
    g2.setAttribute('position',new THREE.BufferAttribute(pp,3));g2.setAttribute('uv',new THREE.BufferAttribute(uu,2));
    g2.setIndex(ix);g2.computeVertexNormals();return g2;
  }
  return geo;
}

function stemTo(hx,hy,hz){

  const grid=(sg,arr)=>{
    const base=pos.length/3;
    for(let i=0;i<=segs;i++)for(let j=0;j<=ws;j++){push(P(i,j,sg));uvs.push(j/ws,i/segs);}
    for(let i=0;i<segs;i++)for(let j=0;j<ws;j++){const a=base+i*(ws+1)+j,b=a+1,c=a+ws+1,d=c+1;arr.push(a,c,b,b,c,d);}
  };
  grid(1,top);grid(-1,bot);
  for(const j of [0,ws]){   // cantos redondeados de la cinta: le dan grosor al verla de lado
    const base=pos.length/3,nk=5;
    for(let i=0;i<=segs;i++)for(let q=0;q<=nk;q++){push(P(i,j,0,q/nk*Math.PI));uvs.push(0,0);}
    for(let i=0;i<segs;i++)for(let q=0;q<nk;q++){const a=base+i*(nk+1)+q,b=a+1,c=a+nk+1,d=c+1;side.push(a,c,b,b,c,d);}
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
  g.setIndex([...top,...side,...bot]);
  g.addGroup(0,top.length+side.length,0);g.addGroup(top.length+side.length,bot.length,1);
  g.computeVertexNormals();
  return new THREE.Mesh(g,[ribM,ribBackM]);
}
const UPV=new THREE.Vector3(0,1,0),ZF=new THREE.Vector3(0,0,1);
// radio de la cinta: ajustada al papel en todo su ancho, hundiéndolo un poco
// radio de la cinta: un círculo constante, ajustado al papel en todo su ancho y hundiéndolo un poco
const ribR=a=>RIB_R;
// 2 vueltas ajustadas alrededor del cuello, cada una algo solapada sobre la anterior; empiezan y acaban delante
(function(){
  const n=360,pts=[];
  for(let i=0;i<=n;i++){const f=i/n,a=Math.PI/2+f*RIB_TURNS*TAU,R=RIB_R+RIB_TH*1.1*f*RIB_TURNS;pts.push(new THREE.Vector3(Math.cos(a)*R,RIB_Y+RIB_DY+RIB_SPAN/2-f*RIB_SPAN,Math.sin(a)*R));}
  world.add(ribbon3D(new THREE.CatmullRomCurve3(pts),900,RIB_W,RIB_TH,p=>({n:UPV,b:new THREE.Vector3(p.x,0,p.z).normalize()})));
})();
const bz=RIB_R+RIB_TH*1.1*RIB_TURNS+0.05,BK=new THREE.Vector3(0,RIB_Y+RIB_DY-RIB_SPAN*0.25,bz);   // nudo simple delante, sobre las vueltas
// 2 colas con ondulaciones y torsión (se ve el revés al girar), puntas en V, hasta el final de los tallos
function tailCurve(sx,len,ph,spread){
  const pts=[],n=120;
  for(let i=0;i<=n;i++){const s0=i/n;
    pts.push(new THREE.Vector3(BK.x+sx*(0.06+spread*s0)+0.13*Math.sin(s0*8+ph)*s0,BK.y-0.06-s0*len,BK.z+0.08+0.07*Math.sin(s0*6+ph*1.3)*s0+0.2*Math.sin(Math.min(1,s0*2)*Math.PI/2)));}
  return new THREE.CatmullRomCurve3(pts);
}
[[-1,2.85,0.4,0.42,0.55],[1,2.7,2.6,0.5,-0.5]].forEach(t=>{
  const tw=t[4];
  world.add(ribbon3D(tailCurve(t[0],t[1],t[2],t[3]),360,0.342,RIB_TH,(p,tg,tt)=>{
    let n=new THREE.Vector3().crossVectors(tg,ZF);if(n.lengthSq()<1e-4)n.set(1,0,0);n.normalize().applyAxisAngle(tg,tw*TAU*tt);
    return {n,b:new THREE.Vector3().crossVectors(n,tg).normalize()};
  },0.1,true));
});
// nudo central pequeño y abultado: núcleo redondeado y una vuelta de cinta con su pliegue
(function(){
  const core=ell(ribM,0.1,0.11,0.085);core.position.copy(BK);world.add(core);
  const pts=[],n=80;
  for(let i=0;i<=n;i++){const ph=i/n*TAU;pts.push(new THREE.Vector3(BK.x,BK.y+0.12*Math.cos(ph),BK.z+0.075*Math.sin(ph)*(1+0.25*Math.cos(ph))));}
  const XA=new THREE.Vector3(1,0,0);
  world.add(ribbon3D(new THREE.CatmullRomCurve3(pts),120,0.2,RIB_TH,(p,tg,tt)=>{const n=XA.clone().applyAxisAngle(tg,0.25*Math.sin(tt*TAU*2));return {n,b:new THREE.Vector3().crossVectors(n,tg).normalize()};}));
})();

// tallos que salen por la punta del papel: en círculo, abriéndose un poco en abanico, largos algo desiguales y cortados en diagonal
(function(){
  const R5=mulb(9901),cols=[0x4f7a3c,0x456e34,0x5b8746,0x3f6630,0x638f4c],mats=cols.map(c=>new THREE.MeshStandardMaterial({color:c,roughness:0.75}));
  const N=18,topY=-1.0,paperBot=CONE_BOT;   // salen por la boca de abajo del cono
  for(let i=0;i<N;i++){
    const ring=i<6?0:1,ang=(ring?(i-6)/12:i/6+0.08)*TAU+(R5()-0.5)*0.25;
    const rt=ring?0.05+R5()*0.03:0.02+R5()*0.02,phi=(ring?6:5)*DEG+R5()*3.5*DEG,r=0.03+R5()*0.014;   // inclinación hacia fuera 5–10°
    const botY=paperBot-(0.9+R5()*0.2),h=(topY-botY)/Math.cos(phi);   // asoman ~0,9–1,1 (5–6 cm) por debajo del cono
    const g=new THREE.CylinderGeometry(r,r,h,12,8),pa=g.attributes.position,k=0.7+R5()*0.5;
    for(let j=0;j<pa.count;j++)if(pa.getY(j)<-h/2+1e-4)pa.setY(j,pa.getY(j)+k*pa.getX(j));   // corte en diagonal
    g.computeVertexNormals();
    const dir=new THREE.Vector3(Math.sin(phi)*Math.cos(ang),-Math.cos(phi),Math.sin(phi)*Math.sin(ang));
    const st=new THREE.Mesh(g,mats[Math.floor(R5()*mats.length)]);
    st.quaternion.setFromUnitVectors(new THREE.Vector3(0,-1,0),dir);
    st.position.set(Math.cos(ang)*rt,topY,Math.sin(ang)*rt).addScaledVector(dir,h/2);
    world.add(st);
  }
})();

// Interacción
let drag=false,lastX=0,lastY=0,tilt=0.42,zoom=13;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const AUTO_ROTATE=false; // pon false para quitar la rotación automática
// Un dedo (o el ratón) gira el ramo; dos dedos hacen zoom de pellizco; la rueda del ratón también hace zoom
const ptrs=new Map();let pinch0=0,zoom0=13;
const ZMIN=3.5,ZMAX=16;
const twoDist=()=>{const [a,b]=[...ptrs.values()];return Math.hypot(a[0]-b[0],a[1]-b[1]);};
canvas.addEventListener('pointerdown',e=>{
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);canvas.setPointerCapture(e.pointerId);
  if(ptrs.size===1){drag=true;lastX=e.clientX;lastY=e.clientY;}
  else if(ptrs.size===2){drag=false;pinch0=twoDist();zoom0=zoom;}
});
const endPtr=e=>{
  ptrs.delete(e.pointerId);
  if(ptrs.size===1){const a=[...ptrs.values()][0];drag=true;lastX=a[0];lastY=a[1];}
  else if(ptrs.size===0)drag=false;
};
canvas.addEventListener('pointerup',endPtr);
canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size>=2){const dd=twoDist();if(pinch0>0&&dd>0)zoom=Math.max(ZMIN,Math.min(ZMAX,zoom0*pinch0/dd));return;}
  if(!drag)return;
  world.rotation.y+=(e.clientX-lastX)*0.01;
  tilt=Math.max(-0.5,Math.min(0.7,tilt+(e.clientY-lastY)*0.004));
  lastX=e.clientX;lastY=e.clientY;
});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(ZMIN,Math.min(ZMAX,zoom+e.deltaY*0.006))},{passive:false});
canvas.addEventListener('gesturestart',e=>e.preventDefault());   // evita el zoom de página de Safari en iPhone
document.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('click',()=>{
  paint(b.dataset.k);
  document.querySelectorAll('[data-k]').forEach(o=>o.setAttribute('aria-pressed',o===b));
}));
function resize(){
  renderer.setSize(innerWidth,innerHeight,false);
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();
// hojas (y tramos ocultos de tallo) que asomaban por fuera del papel: sus trozos por debajo del borde se meten dentro del papel blanco
(function(){
  const leafMs=new Set([ruscM,leafMat,cleafM,lisLeafM]);
  world.updateMatrixWorld(true);
  const inv=world.matrixWorld.clone().invert(),M=new THREE.Matrix4(),Mi=new THREE.Matrix4(),p=new THREE.Vector3();
  world.traverse(o=>{
    if(!o.isMesh||o.isInstancedMesh||!(leafMs.has(o.material)||o.userData.stem))return;
    M.multiplyMatrices(inv,o.matrixWorld);Mi.copy(M).invert();
    const g=o.geometry.clone(),pa=g.attributes.position;let ch=false;
    for(let i=0;i<pa.count;i++){
      p.fromBufferAttribute(pa,i).applyMatrix4(M);
      const az=(Math.atan2(p.z,p.x)*180/Math.PI+360)%360;
      const y0=RIB_Y+(p.y-RIB_Y)/PAPER_SY;   // altura equivalente en el papel sin estirar
      if(y0>topAtDeg(az)+0.05)continue;   // por encima del borde: se ve igual que antes
      const rin=(y0<FUN_YA?NECK_R-0.013:paperR(y0,0.2))*0.9,r=Math.hypot(p.x,p.z);   // en el cuello, dentro de la cinta
      if(r>rin){p.x*=rin/r;p.z*=rin/r;p.applyMatrix4(Mi);pa.setXYZ(i,p.x,p.y,p.z);ch=true;}
    }
    if(ch){g.computeVertexNormals();o.geometry=g;}
  });
})();
if(SHADOWS)world.traverse(o=>{if(o.isMesh&&!o.isInstancedMesh){o.castShadow=true;o.receiveShadow=true;}});
// +15 % de saturación en flores y papel (tallos, hojas, cinta, cordón y papel de seda quedan como estaban)
const SAT=1.15;
(function(){
  const skip=new Set([capM,stemMat,lilyStemM,leafMat,gerStemM,cstemM,calM,cleafM,lisStemM,lisLeafM,daiStemM,ruscM,fillStemM,babyStemM,tissueM,ribM,ribBackM,twineM]);
  const sat=(r,g,b)=>{const y=0.299*r+0.587*g+0.114*b,f=v=>Math.min(1,Math.max(0,y+(v-y)*SAT));return [f(r),f(g),f(b)];};
  const mats=new Set(),texs=new Set();
  world.traverse(o=>{
    if(!o.material)return;
    (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{
      if(skip.has(m)||mats.has(m))return;mats.add(m);
      if(m.color){const c=sat(m.color.r,m.color.g,m.color.b);m.color.setRGB(c[0],c[1],c[2]);}
      ['map','emissiveMap'].forEach(k=>{if(m[k])texs.add(m[k]);});
    });
  });
  texs.forEach(t=>{
    try{
      const cv=t.image,cx=cv.getContext('2d'),im=cx.getImageData(0,0,cv.width,cv.height),d=im.data;
      for(let i=0;i<d.length;i+=4){const c=sat(d[i]/255,d[i+1]/255,d[i+2]/255);d[i]=c[0]*255;d[i+1]=c[1]*255;d[i+2]=c[2]*255;}
      cx.putImageData(im,0,0);t.needsUpdate=true;
    }catch(e){}
  });
})();
function loop(){
  requestAnimationFrame(loop);
  if(AUTO_ROTATE&&!drag&&!reduce)world.rotation.y+=0.004;
  world.rotation.x+=(tilt-world.rotation.x)*0.1;
  camera.position.set(0,1.9,camera.position.z||13);
  const fit=Math.max(5.5/0.364,5.2/(0.364*camera.aspect));
  camera.position.z+=(fit*zoom/13-camera.position.z)*0.1;
  camera.lookAt(0,1.2,0);
  renderer.render(scene,camera);
}
loop();
</script>
